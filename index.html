<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#c2185b">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<title>Yagona ayollar liboslari</title>
<style>
:root{--m:#c2185b;--line:#eee;--bg:#faf7f8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,Arial,sans-serif;background:var(--bg);color:#1c1c1c;padding-bottom:84px}
.top{padding:15px;text-align:center;background:#fff;font-weight:800;letter-spacing:2px;color:var(--m);font-size:16px;position:sticky;top:0;z-index:5}
#search{display:block;margin:12px 16px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#fff;width:calc(100% - 32px);font-size:15px;outline:none}
h1{font-size:25px;padding:8px 16px;line-height:1.2}h2{font-size:20px;padding:14px 16px 8px}
.marq{background:#111;color:#fff;margin:8px 16px;border-radius:7px;overflow:hidden;white-space:nowrap;padding:13px 0}
.marq span{display:inline-block;padding-left:100%;animation:m 14s linear infinite}
@keyframes m{to{transform:translateX(-100%)}}
.stories{display:flex;gap:14px;overflow-x:auto;padding:0 16px 8px}
.st{flex:none;width:76px;text-align:center;font-size:12px}
.ring{width:76px;height:76px;border-radius:50%;border:3px solid #111;padding:3px;margin-bottom:6px}
.ring div{width:100%;height:100%;border-radius:50%;overflow:hidden;background:#f8d7e4;display:flex;align-items:center;justify-content:center;font-size:29px}
.banners{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px 16px}
.bn{flex:none;width:86%;height:145px;border-radius:18px;scroll-snap-align:center;color:#fff;padding:20px;display:flex;flex-direction:column;justify-content:flex-end;font-size:22px;font-weight:700}
.bn small{font-size:13px;font-weight:400;opacity:.9}
.cgrid,.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:8px 16px}
.ct{height:170px;border-radius:18px;background:#f8d7e4;position:relative;display:flex;align-items:center;justify-content:center;font-size:54px}
.ct b{position:absolute;left:10px;top:10px;font-size:11px;letter-spacing:1px;background:#0008;color:#fff;border-radius:14px;padding:6px 10px}
.ct em{position:absolute;left:12px;bottom:10px;font-size:15px;font-style:normal;font-weight:700;color:#111}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px}
.chip{flex:none;padding:8px 15px;border-radius:20px;background:#fff;border:1px solid #f3c1d3;color:var(--m);font-size:14px}
.chip.on{background:var(--m);color:#fff}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 8px #0000000d;cursor:pointer}
.pic{height:190px;background:#fce4ec;display:flex;align-items:center;justify-content:center;font-size:54px;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover}
.info{padding:10px}.name{font-size:14px;font-weight:600;line-height:1.35}
.price{color:var(--m);font-weight:700;margin-top:5px;font-size:14px}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;display:flex;border-top:1px solid var(--line);padding:8px 0 14px;z-index:10}
.tab{flex:1;text-align:center;font-size:11px;color:#888;position:relative;cursor:pointer}
.tab i{display:block;font-style:normal;font-size:22px;margin-bottom:2px}
.tab.on{color:#111;font-weight:700}
.badge{position:absolute;top:-4px;left:56%;background:var(--m);color:#fff;border-radius:10px;font-size:10px;padding:1px 6px}
#sheet{display:none;position:fixed;inset:0;background:#fff;z-index:20;overflow:auto}
.x{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:50%;background:#fffd;display:flex;align-items:center;justify-content:center;z-index:2;font-size:20px;cursor:pointer}
.big{height:360px;background:#fce4ec;display:flex;align-items:center;justify-content:center;font-size:90px;overflow:hidden}
.big img{width:100%;height:100%;object-fit:cover}
.pad{padding:18px 16px}.n2{font-size:22px;font-weight:700}.p2{color:var(--m);font-size:20px;font-weight:700;margin:6px 0 16px}
.lbl{font-size:13px;color:#888;margin-bottom:8px}
.sizes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.sz{min-width:46px;text-align:center;padding:10px 14px;border:1px solid #ddd;border-radius:12px;cursor:pointer}
.sz.on{background:#111;color:#fff;border-color:#111}
.main{width:100%;padding:15px;border:0;border-radius:14px;background:var(--m);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
.row{display:flex;gap:12px;background:#fff;margin:10px 16px;padding:10px;border-radius:14px;align-items:center}
.row .pic{width:70px;height:70px;border-radius:10px;font-size:30px;flex:none}
.row .mid{flex:1;font-size:14px}.row .mid small{color:#888}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:30px;height:30px;border-radius:50%;border:1px solid #ddd;background:#fff;font-size:16px}
.empty{text-align:center;color:#888;padding:55px 20px;line-height:1.6}
.tot{margin:16px;font-size:18px;font-weight:700}
.ob{margin:0 16px;width:calc(100% - 32px)}
.status{text-align:center;color:#888;padding:18px;font-size:13px}
.error{color:#b00020}
</style>
</head>
<body>
<div class="top">YAGONA AYOLLAR LIBOSLARI</div>
<input id="search" placeholder="Kiyim qidirish..." oninput="doSearch(this.value)">
<div id="app"><div class="status">Mahsulotlar yuklanmoqda...</div></div>
<div id="sheet"></div>
<div class="nav">
 <div class="tab on" data-t="home" onclick="go('home')"><i>🏠</i>Bosh sahifa</div>
 <div class="tab" data-t="cat" onclick="go('cat')"><i>▦</i>Katalog</div>
 <div class="tab" data-t="cart" onclick="go('cart')"><i>🛒</i>Savat<span class="badge" id="bd" style="display:none"></span></div>
 <div class="tab" data-t="me" onclick="go('me')"><i>👤</i>Profil</div>
</div>
<script>
/* SUPABASE SOZLAMALARI */
const SUPABASE_URL = "https://uazlxovtzekrvwxbnldb.supabase.co";
const SUPABASE_KEY = "sb_publishable_ha3VUvvIXAQYMSw831l3GA_B6FR_v_Q";
const SELLER = "SOTUVCHI_USERNAME"; // Bu yerga Telegram username yoziladi, @ belgisiz
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const cats = [
 {n:"Ko'ylak",e:"👗"},{n:"Yubka",e:"🌸"},{n:"Kostyum",e:"🧥"},{n:"Bluzka",e:"👚"}
];
let products=[],tab="home",flt="",q="",cur=null,size=null;
const cart={};
const $=s=>document.querySelector(s);
const fmt=n=>Number(n||0).toLocaleString("ru-RU")+" so'm";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function normalize(p){
 const rawSizes=p.sizes??p.size??["S","M","L"];
 let sizes=Array.isArray(rawSizes)?rawSizes:String(rawSizes).split(",").map(x=>x.trim()).filter(Boolean);
 return {id:p.id,name:p.name??p.title??"Nomsiz mahsulot",price:Number(p.price??0),cat:p.category??p.cat??"Boshqa",sizes:sizes.length?sizes:["Universal"],img:p.image_url??p.img??p.image??"",emoji:"👗"};
}
async function loadProducts(){
 const {data,error}=await db.from("products").select("*").order("created_at",{ascending:false});
 if(error){$("#app").innerHTML=`<div class="empty error">Mahsulotlarni yuklab bo'lmadi.<br>${esc(error.message)}<br><br>Supabase jadvalidagi ustunlarni tekshirish kerak.</div>`;return;}
 products=(data||[]).map(normalize);
 render();
}
function pic(p){return p.img?`<img src="${esc(p.img)}" alt="${esc(p.name)}" onerror="this.style.display='none';this.parentElement.textContent='${p.emoji}'">`:p.emoji}
function card(p){return `<div class="card" onclick="openP('${String(p.id).replace(/'/g,"\\'")}')"><div class="pic">${pic(p)}</div><div class="info"><div class="name">${esc(p.name)}</div><div class="price">${fmt(p.price)}</div></div></div>`}
function home(){
 const count=c=>products.filter(p=>p.cat===c).length;
 return `<h1>O'z uslubingni tanla</h1>
 <div class="marq"><span>Ayollar uchun nafis liboslar · Yangi kolleksiya · Buyurtma bir necha bosqichda</span></div>
 <h2>Kategoriyalar</h2>
 <div class="stories">${cats.map(c=>`<div class="st" onclick="goCat('${c.n}')"><div class="ring"><div>${c.e}</div></div>${c.n}</div>`).join("")}</div>
 <div class="banners">
  <div class="bn" style="background:linear-gradient(135deg,#c2185b,#ff80ab)">Yangi kolleksiya<small>Eng so'nggi liboslar</small></div>
  <div class="bn" style="background:linear-gradient(135deg,#6a1b9a,#ce93d8)">Oqshom ko'ylaklari<small>Bayram uchun</small></div>
  <div class="bn" style="background:linear-gradient(135deg,#ad1457,#f48fb1)">Kundalik uslub<small>Qulay va chiroyli</small></div>
 </div>
 <h2>Katalog</h2><div class="cgrid">${cats.map(c=>`<div class="ct" onclick="goCat('${c.n}')"><b>${count(c.n)} TOVAR</b>${c.e}<em>${c.n}</em></div>`).join("")}</div>
 <h2>Yangi mahsulotlar</h2>${products.length?`<div class="grid">${products.slice(0,4).map(card).join("")}</div>`:`<div class="empty">Hozircha mahsulot yo'q.<br>Yangi kiyimlar tez orada qo'shiladi 🌸</div>`}`;
}
function catalog(){
 const list=products.filter(p=>(!flt||p.cat===flt)&&(!q||p.name.toLowerCase().includes(q.toLowerCase())));
 const allCats=[...new Set([...cats.map(c=>c.n),...products.map(p=>p.cat)])];
 return `<div class="chips"><div class="chip ${!flt?"on":""}" onclick="setF('')">Hammasi</div>${allCats.map(c=>`<div class="chip ${flt===c?"on":""}" onclick="setF('${esc(c)}')">${esc(c)}</div>`).join("")}</div>
 ${list.length?`<div class="grid">${list.map(card).join("")}</div>`:`<div class="empty">Hech narsa topilmadi</div>`}`;
}
function cartView(){
 const keys=Object.keys(cart);
 if(!keys.length)return `<div class="empty">🛒<br><br>Savat bo'sh</div>`;
 let sum=0;
 const rows=keys.map(k=>{
  const [id,s]=k.split("|"),p=products.find(x=>String(x.id)===id);if(!p)return "";
  sum+=p.price*cart[k];
  return `<div class="row"><div class="pic">${pic(p)}</div><div class="mid">${esc(p.name)}<br><small>O'lcham: ${esc(s)}</small><br><b>${fmt(p.price)}</b></div><div class="qty"><button onclick="chg('${esc(k)}',-1)">−</button>${cart[k]}<button onclick="chg('${esc(k)}',1)">+</button></div></div>`;
 }).join("");
 return rows+`<div class="tot">Jami: ${fmt(sum)}</div><button class="main ob" onclick="order()">Buyurtma berish</button>`;
}
function me(){
 const u=window.Telegram?.WebApp?.initDataUnsafe?.user;
 return `<div class="pad"><div class="n2">Salom, ${esc(u?.first_name||"mehmon")} 🌸</div><p style="color:#888;margin:10px 0 24px">Savol bo'lsa yoki o'lcham tanlashda yordam kerak bo'lsa, bizga yozing.</p><button class="main" onclick="contactSeller()">Sotuvchiga yozish</button></div>`;
}
function render(){
 document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.t===tab));
 $("#app").innerHTML=tab==="home"?home():tab==="cat"?catalog():tab==="cart"?cartView():me();
 $("#search").style.display=(tab==="home"||tab==="cat")?"block":"none";
 const n=Object.values(cart).reduce((a,b)=>a+b,0);$("#bd").style.display=n?"inline":"none";$("#bd").innerText=n;
 window.scrollTo(0,0);
}
function go(t){tab=t;render()}
function goCat(c){flt=c;q="";$("#search").value="";tab="cat";render()}
function setF(c){flt=c;render()}
function doSearch(v){q=v;tab="cat";render()}
function chg(k,d){cart[k]+=d;if(cart[k]<=0)delete cart[k];render()}
function openP(id){cur=products.find(p=>String(p.id)===String(id));if(!cur)return;size=cur.sizes[0];sheet()}
function sheet(){
 $("#sheet").innerHTML=`<div class="x" onclick="closeP()">✕</div><div class="big">${pic(cur)}</div><div class="pad"><div class="n2">${esc(cur.name)}</div><div class="p2">${fmt(cur.price)}</div><div class="lbl">O'lcham</div><div class="sizes">${cur.sizes.map(s=>`<span class="sz ${s===size?"on":""}" onclick="setSize('${esc(s)}')">${esc(s)}</span>`).join("")}</div><button class="main" onclick="addCur()">Savatga qo'shish</button></div>`;
 $("#sheet").style.display="block";
}
function setSize(s){size=s;sheet()}
function closeP(){$("#sheet").style.display="none"}
function addCur(){const k=cur.id+"|"+size;cart[k]=(cart[k]||0)+1;closeP();render()}
function contactSeller(){
 if(SELLER==="SOTUVCHI_USERNAME"){alert("Kod ichidagi SELLER qatoriga Telegram username yozing.");return;}
 const url="https://t.me/"+SELLER;
 if(window.Telegram?.WebApp?.openTelegramLink)Telegram.WebApp.openTelegramLink(url);else location.href=url;
}
function order(){
 if(SELLER==="SOTUVCHI_USERNAME"){alert("Buyurtma olish uchun kod ichidagi SELLER qatoriga Telegram username yozing.");return;}
 let t="Assalomu alaykum! Buyurtma bermoqchiman:\n",sum=0;
 Object.keys(cart).forEach(k=>{const [id,s]=k.split("|"),p=products.find(x=>String(x.id)===id);if(!p)return;t+=`• ${p.name}, o'lcham ${s} x${cart[k]} — ${fmt(p.price*cart[k])}\n`;sum+=p.price*cart[k]});
 t+=`\nJami: ${fmt(sum)}`;
 const url="https://t.me/"+SELLER+"?text="+encodeURIComponent(t);
 if(window.Telegram?.WebApp?.openTelegramLink)Telegram.WebApp.openTelegramLink(url);else location.href=url;
}
if(window.Telegram?.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand();}
loadProducts();
</script>
</body>
</html>
