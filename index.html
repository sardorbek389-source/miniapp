<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#c2185b">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<title>Yagona ayollar liboslari</title>
<style>
:root{--m:#c2185b;--line:#eee;--bg:#faf7f8;--ink:#21191d;--muted:#888}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:84px}
.top{padding:15px;text-align:center;background:#fff;font-weight:800;letter-spacing:2px;color:var(--m);font-size:16px;position:sticky;top:0;z-index:5}
#search{display:block;margin:12px 16px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#fff;width:calc(100% - 32px);font-size:15px;outline:none}
h1{font-size:25px;padding:8px 16px;line-height:1.2}h2{font-size:20px;padding:14px 16px 8px}
.marq{background:#111;color:#fff;margin:8px 16px;border-radius:7px;overflow:hidden;white-space:nowrap;padding:13px 0}
.marq span{display:inline-block;padding-left:100%;animation:m 14s linear infinite}@keyframes m{to{transform:translateX(-100%)}}
.stories{display:flex;gap:14px;overflow-x:auto;padding:0 16px 8px}
.st{flex:none;width:76px;text-align:center;font-size:12px;cursor:pointer}
.ring{width:76px;height:76px;border-radius:50%;border:3px solid #111;padding:3px;margin-bottom:6px}
.ring div{width:100%;height:100%;border-radius:50%;overflow:hidden;background:#f8d7e4;display:flex;align-items:center;justify-content:center;font-size:29px}
.ring img{width:100%;height:100%;object-fit:cover}
.banners{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px 16px}
.bn{flex:none;width:86%;height:145px;border-radius:18px;scroll-snap-align:center;color:#fff;padding:20px;display:flex;flex-direction:column;justify-content:flex-end;font-size:22px;font-weight:700;background:linear-gradient(135deg,#c2185b,#ff80ab);background-size:cover;background-position:center}
.bn small{font-size:13px;font-weight:400;opacity:.95}
.cgrid,.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:8px 16px}
.ct{height:150px;border-radius:18px;background:#f8d7e4;position:relative;display:flex;align-items:center;justify-content:center;font-size:48px;overflow:hidden;cursor:pointer}
.ct img{width:100%;height:100%;object-fit:cover}
.ct b{position:absolute;left:10px;top:10px;font-size:10px;letter-spacing:1px;background:#0008;color:#fff;border-radius:14px;padding:6px 10px}
.ct em{position:absolute;left:12px;bottom:10px;font-size:15px;font-style:normal;font-weight:700;color:#fff;text-shadow:0 1px 5px #000}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px}
.chip{flex:none;padding:8px 15px;border-radius:20px;background:#fff;border:1px solid #f3c1d3;color:var(--m);font-size:14px;cursor:pointer}
.chip.on{background:var(--m);color:#fff}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 8px #0000000d;cursor:pointer;position:relative}
.pic{height:190px;background:#fce4ec;display:flex;align-items:center;justify-content:center;font-size:54px;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover}
.info{padding:10px}.name{font-size:14px;font-weight:600;line-height:1.35}
.price{color:var(--m);font-weight:700;margin-top:5px;font-size:14px}
.heart{position:absolute;right:9px;top:9px;width:34px;height:34px;border:0;border-radius:50%;background:#ffffffed;font-size:19px;z-index:1}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;display:flex;border-top:1px solid var(--line);padding:8px 0 14px;z-index:10}
.tab{flex:1;text-align:center;font-size:11px;color:#888;position:relative;cursor:pointer}
.tab i{display:block;font-style:normal;font-size:22px;margin-bottom:2px}
.tab.on{color:#111;font-weight:700}
.badge{position:absolute;top:-4px;left:56%;background:var(--m);color:#fff;border-radius:10px;font-size:10px;padding:1px 6px}
#sheet,#checkout,#story{display:none;position:fixed;inset:0;background:#fff;z-index:20;overflow:auto}
.x{position:sticky;float:right;right:14px;top:12px;margin:12px 14px -50px 0;width:38px;height:38px;border-radius:50%;background:#fffd;display:flex;align-items:center;justify-content:center;z-index:3;font-size:20px;cursor:pointer;border:0}
.big{height:360px;background:#fce4ec;display:flex;align-items:center;justify-content:center;font-size:90px;overflow:hidden}
.big img{width:100%;height:100%;object-fit:cover}
.pad{padding:18px 16px}.n2{font-size:22px;font-weight:700}.p2{color:var(--m);font-size:20px;font-weight:700;margin:6px 0 16px}
.lbl{font-size:13px;color:#888;margin:12px 0 8px}
.sizes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.sz{min-width:46px;text-align:center;padding:10px 14px;border:1px solid #ddd;border-radius:12px;cursor:pointer}
.sz.on{background:#111;color:#fff;border-color:#111}
.main{width:100%;padding:15px;border:0;border-radius:14px;background:var(--m);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
.main:disabled{opacity:.55}
.row{display:flex;gap:12px;background:#fff;margin:10px 16px;padding:10px;border-radius:14px;align-items:center}
.row .pic{width:70px;height:70px;border-radius:10px;font-size:30px;flex:none}
.row .mid{flex:1;font-size:14px;min-width:0}.row .mid small{color:#888}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:30px;height:30px;border-radius:50%;border:1px solid #ddd;background:#fff;font-size:16px}
.empty{text-align:center;color:#888;padding:55px 20px;line-height:1.6}
.tot{margin:16px;font-size:18px;font-weight:700}
.ob{margin:0 16px;width:calc(100% - 32px)}
.status{text-align:center;color:#888;padding:18px;font-size:13px}
.error{color:#b00020}
.field{display:block;width:100%;padding:13px 14px;border:1px solid #e8dfe3;border-radius:12px;background:#fff;font-size:15px;margin:7px 0 12px;outline:none}
textarea.field{min-height:76px;resize:vertical}
.option{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #eee;border-radius:13px;padding:13px;margin:8px 0;font-size:14px}
.option input{accent-color:var(--m);width:18px;height:18px}
.profile-head{margin:16px;background:#fff;border-radius:18px;padding:22px;text-align:center}
.avatar{width:76px;height:76px;border-radius:50%;object-fit:cover;background:#f8d7e4;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:30px}
.profile-link{display:flex;justify-content:space-between;align-items:center;background:#fff;margin:9px 16px;padding:16px;border-radius:13px;font-size:15px}
.small-muted{color:#888;font-size:12px}
.section-title{padding:16px;font-size:20px;font-weight:700}
.notice{margin:12px 16px;padding:12px;border-radius:12px;background:#fff4f7;color:#8a2348;font-size:13px;line-height:1.5}
</style>
</head>
<body>
<div class="top">YAGONA AYOLLAR LIBOSLARI</div>
<input id="search" placeholder="Kiyim qidirish..." oninput="doSearch(this.value)">
<div id="app"><div class="status">Mahsulotlar yuklanmoqda...</div></div>
<div id="sheet"></div><div id="checkout"></div><div id="story"></div>
<div class="nav">
 <div class="tab on" data-t="home" onclick="go('home')"><i>🏠</i>Bosh sahifa</div>
 <div class="tab" data-t="cat" onclick="go('cat')"><i>▦</i>Katalog</div>
 <div class="tab" data-t="cart" onclick="go('cart')"><i>🛒</i>Savat<span class="badge" id="bd" style="display:none"></span></div>
 <div class="tab" data-t="me" onclick="go('me')"><i>👤</i>Profil</div>
</div>
<script>
const SUPABASE_URL="https://uazlxovtzekrvwxbnldb.supabase.co";
const SUPABASE_KEY="sb_publishable_ha3VUvvIXAQYMSw831l3GA_B6FR_v_Q";
const SELLER="ssm_usa";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const tg=window.Telegram?.WebApp;
let products=[],categories=[],highlights=[],banners=[],tab="home",flt="",q="",cur=null,size=null;
let favorites=JSON.parse(localStorage.getItem("yagona_favorites")||"[]");
const cart={};
const $=s=>document.querySelector(s);
const fmt=n=>Number(n||0).toLocaleString("ru-RU")+" so'm";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function normalize(p){let raw=p.sizes??p.size??["S","M","L"];let ss=Array.isArray(raw)?raw:String(raw).split(",").map(x=>x.trim()).filter(Boolean);return{id:p.id,name:p.name??p.title??"Nomsiz mahsulot",price:Number(p.price??0),cat:p.category??p.cat??"Boshqa",sizes:ss.length?ss:["Universal"],img:p.image_url??p.img??"",emoji:"👗"}}
async function safeList(table,order="sort_order"){try{let r=await db.from(table).select("*").eq("is_active",true).order(order,{ascending:true});return r.error?[]:(r.data||[])}catch(e){return[]}}
async function loadAll(){
 const [pr,ca,hi,bn]=await Promise.all([
  db.from("products").select("*").order("created_at",{ascending:false}),
  safeList("categories"),safeList("highlights"),safeList("banners")
 ]);
 if(pr.error){$("#app").innerHTML=`<div class="empty error">Mahsulotlarni yuklab bo'lmadi.<br>${esc(pr.error.message)}</div>`;return}
 products=(pr.data||[]).map(normalize);categories=ca;highlights=hi;banners=bn;render();
}
function pic(p){return p.img?`<img src="${esc(p.img)}" alt="${esc(p.name)}" onerror="this.style.display='none';this.parentElement.textContent='👗'">`:"👗"}
function card(p){let fav=favorites.includes(String(p.id));return `<div class="card"><button class="heart" onclick="event.stopPropagation();toggleFav('${esc(p.id)}')">${fav?"❤️":"♡"}</button><div onclick="openP('${esc(p.id)}')"><div class="pic">${pic(p)}</div><div class="info"><div class="name">${esc(p.name)}</div><div class="price">${fmt(p.price)}</div></div></div></div>`}
function categoryNames(){return categories.length?categories.map(c=>({n:c.name,e:"👗",img:c.image_url||""})): [...new Set(products.map(p=>p.cat))].map(n=>({n,e:"👗",img:""}))}
function home(){
 let cats=categoryNames();
 let story=highlights.length?highlights.map(h=>`<div class="st" onclick="openStory('${esc(h.id)}')"><div class="ring"><div>${h.image_url?`<img src="${esc(h.image_url)}">`:"🌸"}</div></div>${esc(h.title)}</div>`).join(""):cats.slice(0,6).map(c=>`<div class="st" onclick="goCat('${esc(c.n)}')"><div class="ring"><div>${c.img?`<img src="${esc(c.img)}">`:c.e}</div></div>${esc(c.n)}</div>`).join("");
 let bannerHtml=banners.length?banners.map(b=>`<div class="bn" style="${b.image_url?`background-image:linear-gradient(0deg,#0008,#0002),url('${esc(b.image_url)}')`:""}" onclick="${b.link_url?`openLink('${esc(b.link_url)}')`:""}">${esc(b.title||"Yangi kolleksiya")}<small>${esc(b.subtitle||"Yangi liboslar")}</small></div>`).join(""):`<div class="bn">Yangi kolleksiya<small>Eng so'nggi liboslar</small></div>`;
 return `<h1>O'z uslubingni tanla</h1><div class="marq"><span>Ayollar uchun nafis liboslar · Yangi kolleksiya · Buyurtma bir necha bosqichda</span></div>
 <h2>${highlights.length?"Yangiliklar":"Kategoriyalar"}</h2><div class="stories">${story}</div>
 <div class="banners">${bannerHtml}</div>
 <h2>Kategoriyalar</h2><div class="cgrid">${cats.map(c=>`<div class="ct" onclick="goCat('${esc(c.n)}')">${c.img?`<img src="${esc(c.img)}">`:c.e}<b>${products.filter(p=>p.cat===c.n).length} TOVAR</b><em>${esc(c.n)}</em></div>`).join("")}</div>
 <h2>Yangi mahsulotlar</h2>${products.length?`<div class="grid">${products.slice(0,4).map(card).join("")}</div>`:`<div class="empty">Hozircha mahsulot yo'q 🌸</div>`}`;
}
function catalog(){let names=[...new Set([...categoryNames().map(c=>c.n),...products.map(p=>p.cat)])];let list=products.filter(p=>(!flt||p.cat===flt)&&(!q||p.name.toLowerCase().includes(q.toLowerCase())));return `<div class="chips"><div class="chip ${!flt?"on":""}" onclick="setF('')">Hammasi</div>${names.map(c=>`<div class="chip ${flt===c?"on":""}" onclick="setF('${esc(c)}')">${esc(c)}</div>`).join("")}</div>${list.length?`<div class="grid">${list.map(card).join("")}</div>`:`<div class="empty">Hech narsa topilmadi</div>`}`}
function cartView(){let keys=Object.keys(cart);if(!keys.length)return `<div class="empty">🛒<br><br>Savat bo'sh</div>`;let sum=0;let rows=keys.map(k=>{let [id,s]=k.split("|"),p=products.find(x=>String(x.id)===id);if(!p)return"";sum+=p.price*cart[k];return `<div class="row"><div class="pic">${pic(p)}</div><div class="mid">${esc(p.name)}<br><small>O'lcham: ${esc(s)}</small><br><b>${fmt(p.price)}</b></div><div class="qty"><button onclick="chg('${esc(k)}',-1)">−</button>${cart[k]}<button onclick="chg('${esc(k)}',1)">+</button></div></div>`}).join("");return rows+`<div class="tot">Jami: ${fmt(sum)}</div><button class="main ob" onclick="checkout()">Buyurtmani rasmiylashtirish</button><div class="notice">Buyurtma berishdan oldin telefon raqamingiz va yetkazib berish manzilingizni kiriting.</div>`}
function me(){let u=tg?.initDataUnsafe?.user;let name=[u?.first_name,u?.last_name].filter(Boolean).join(" ")||"Telegram foydalanuvchisi";let avatar=u?.photo_url?`<img class="avatar" src="${esc(u.photo_url)}">`:`<div class="avatar">👤</div>`;return `<div class="profile-head">${avatar}<div class="n2">${esc(name)}</div><div class="small-muted">${u?.username?"@"+esc(u.username):"Telegram profili"}</div><div class="small-muted" style="margin-top:8px">Telegram profilingiz</div></div><div class="profile-link" onclick="showFavorites()">❤️ Sevimlilar <span>›</span></div><div class="profile-link" onclick="showOrders()">📦 Mening buyurtmalarim <span>›</span></div><div class="profile-link" onclick="contactSeller()">💬 Sotuvchiga yozish <span>›</span></div><div class="notice">Telefon raqami buyurtma rasmiylashtirish vaqtida so'raladi.</div>`}
function render(){document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.t===tab));$("#app").innerHTML=tab==="home"?home():tab==="cat"?catalog():tab==="cart"?cartView():me();$("#search").style.display=(tab==="home"||tab==="cat")?"block":"none";let n=Object.values(cart).reduce((a,b)=>a+b,0);$("#bd").style.display=n?"inline":"none";$("#bd").innerText=n;window.scrollTo(0,0)}
function go(t){tab=t;render()}function goCat(c){flt=c;q="";$("#search").value="";tab="cat";render()}function setF(c){flt=c;render()}function doSearch(v){q=v;tab="cat";render()}
function chg(k,d){cart[k]+=d;if(cart[k]<=0)delete cart[k];render()}
function openP(id){cur=products.find(p=>String(p.id)===String(id));if(!cur)return;size=cur.sizes[0];sheet()}
function sheet(){$("#sheet").innerHTML=`<button class="x" onclick="closeP()">✕</button><div class="big">${pic(cur)}</div><div class="pad"><div class="n2">${esc(cur.name)}</div><div class="p2">${fmt(cur.price)}</div><div class="lbl">O'lchamni tanlang</div><div class="sizes">${cur.sizes.map(s=>`<span class="sz ${s===size?"on":""}" onclick="setSize('${esc(s)}')">${esc(s)}</span>`).join("")}</div><button class="main" onclick="addCur()">Savatga qo'shish</button></div>`;$("#sheet").style.display="block"}
function setSize(s){size=s;sheet()}function closeP(){$("#sheet").style.display="none"}function addCur(){let k=cur.id+"|"+size;cart[k]=(cart[k]||0)+1;closeP();go("cart")}
function toggleFav(id){id=String(id);favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];localStorage.setItem("yagona_favorites",JSON.stringify(favorites));render()}
function showFavorites(){let list=products.filter(p=>favorites.includes(String(p.id)));$("#sheet").innerHTML=`<button class="x" onclick="closeP()">✕</button><div class="section-title">❤️ Sevimlilar</div>${list.length?`<div class="grid">${list.map(card).join("")}</div>`:`<div class="empty">Hozircha sevimli mahsulot yo'q</div>`}`;$("#sheet").style.display="block"}
function openStory(id){let h=highlights.find(x=>String(x.id)===String(id));if(!h)return;$("#story").innerHTML=`<button class="x" onclick="$('#story').style.display='none'">✕</button>${h.image_url?`<img src="${esc(h.image_url)}" style="width:100%;height:70vh;object-fit:contain;background:#111">`:`<div class="empty">🌸</div>`}<div class="pad"><div class="n2">${esc(h.title)}</div></div>`;$("#story").style.display="block"}
function openLink(url){if(url)tg?.openLink?tg.openLink(url):window.open(url,"_blank")}
function contactSeller(){if(SELLER==="SOTUVCHI_USERNAME"){alert("Sotuvchi Telegram username'i hali sozlanmagan.");return}let url="https://t.me/"+SELLER;tg?.openTelegramLink?tg.openTelegramLink(url):location.href=url}
function total(){return Object.keys(cart).reduce((s,k)=>{let p=products.find(x=>String(x.id)===k.split("|")[0]);return s+(p?p.price*cart[k]:0)},0)}
function checkout(){if(!Object.keys(cart).length)return;let u=tg?.initDataUnsafe?.user;let defaultName=[u?.first_name,u?.last_name].filter(Boolean).join(" ");$("#checkout").innerHTML=`<button class="x" onclick="closeCheckout()">✕</button><div class="section-title">Buyurtmani rasmiylashtirish</div><div class="pad"><div class="lbl">Ismingiz</div><input class="field" id="customerName" placeholder="Ism familiya" value="${esc(defaultName)}"><div class="lbl">Telefon raqamingiz</div><input class="field" id="phone" type="tel" placeholder="+998 90 123 45 67" inputmode="tel"><div class="lbl">Yetkazib berish manzili</div><textarea class="field" id="address" placeholder="Viloyat, tuman, ko'cha, uy"></textarea><div class="lbl">To'lov usuli</div><label class="option"><input type="radio" name="payment" value="Karta orqali" checked> 💳 Karta orqali to'lov (operator tasdiqlaydi)</label><label class="option"><input type="radio" name="payment" value="Naqd pul"> 💵 Yetkazilganda naqd pul</label><label class="option"><input type="radio" name="payment" value="Click / Payme"> 📱 Click / Payme (operator bilan kelishiladi)</label><div class="tot">Jami: ${fmt(total())}</div><button class="main" id="sendOrder" onclick="submitOrder()">Buyurtmani yuborish</button><div class="notice">Buyurtma yuborilgach, sotuvchi siz bilan bog'lanib, to'lov va yetkazib berishni tasdiqlaydi.</div></div>`;$("#checkout").style.display="block"}
function closeCheckout(){$("#checkout").style.display="none"}
async function submitOrder(){let name=$("#customerName").value.trim(),phone=$("#phone").value.trim(),address=$("#address").value.trim(),payment=document.querySelector('input[name="payment"]:checked')?.value||"Karta orqali";if(!name||!phone||!address){alert("Iltimos, ism, telefon raqami va manzilni to'liq kiriting.");return}let btn=$("#sendOrder");btn.disabled=true;btn.textContent="Yuborilmoqda...";let u=tg?.initDataUnsafe?.user;let items=Object.keys(cart).map(k=>{let [id,s]=k.split("|"),p=products.find(x=>String(x.id)===id);return p?{product_id:p.id,name:p.name,price:p.price,size:s,quantity:cart[k]}:null}).filter(Boolean);let payload={customer_name:name,phone,address,payment_method:payment,total:total(),items,telegram_user_id:u?.id?String(u.id):null,telegram_username:u?.username||null,status:"Yangi"};let {error}=await db.from("orders").insert(payload);if(error){btn.disabled=false;btn.textContent="Buyurtmani yuborish";alert("Buyurtma saqlanmadi: "+error.message+"\nAvval berilgan SQL kod orqali orders jadvalini yaratish kerak.");return}let orderId="yangi";let msg=`Yangi buyurtma\n${name}\nTel: ${phone}\nManzil: ${address}\nTo'lov: ${payment}\n\n`+items.map(x=>`${x.name} / ${x.size} x${x.quantity} — ${fmt(x.price*x.quantity)}`).join("\n")+`\n\nJami: ${fmt(payload.total)}`;Object.keys(cart).forEach(k=>delete cart[k]);closeCheckout();go("cart");alert("Buyurtmangiz qabul qilindi! Sotuvchi tez orada siz bilan bog'lanadi.");if(SELLER!=="SOTUVCHI_USERNAME"){let url="https://t.me/"+SELLER+"?text="+encodeURIComponent(msg);tg?.openTelegramLink?tg.openTelegramLink(url):window.open(url,"_blank")}}
async function showOrders(){let u=tg?.initDataUnsafe?.user;if(!u?.id){alert("Buyurtmalarni ko'rish uchun Mini App'ni Telegram ichida oching.");return}let {data,error}=await db.from("orders").select("id,created_at,total,status,payment_method").eq("telegram_user_id",String(u.id)).order("created_at",{ascending:false}).limit(20);if(error){alert("Buyurtmalarni yuklab bo'lmadi: "+error.message);return}$("#sheet").innerHTML=`<button class="x" onclick="closeP()">✕</button><div class="section-title">📦 Mening buyurtmalarim</div>${data?.length?data.map(o=>`<div class="row"><div class="mid"><b>Buyurtma #${esc(o.id)}</b><br><small>${esc(new Date(o.created_at).toLocaleString("uz-UZ"))}</small><br>${esc(o.status||"Yangi")} · ${esc(o.payment_method||"")}</div><b>${fmt(o.total)}</b></div>`).join(""):`<div class="empty">Hozircha buyurtmalar yo'q</div>`}`;$("#sheet").style.display="block"}
if(tg){tg.ready();tg.expand()}
loadAll();
</script>
</body>
</html>
